<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bio-Pass — Pasaporte Médico Inteligente | Doorway Cortex</title>

    <!-- Apply the saved theme before first paint to avoid a flash. Default: light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('biopass_theme') || 'light';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="application-name" content="Bio-Pass" />
    <meta name="apple-mobile-web-app-title" content="Bio-Pass" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="description" content="Pasaporte médico inteligente con cifrado Zero-Knowledge, QR de rescate para emergencias y expediente clínico portátil." />
    
    <!-- Icons & Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="mask-icon" href="/icon.svg" color="#0d9488" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-app text-fg font-sans antialiased selection:bg-teal-500 selection:text-white min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
