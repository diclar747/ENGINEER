server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Service worker must never be cached stale
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # API + uploaded files proxied to the backend container.
  # Se apunta directo al servicio swarm `biopass-backend` (no a ${BACKEND_ORIGIN}): Dokploy
  # reseteaba esa env en cada deploy y dejaba el /api en 502. Si el backend pasa a ser una app
  # Dokploy con otro nombre de servicio, cambiar acá.
  location ^~ /api/ {
    proxy_pass http://biopass-backend:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;
  }

  location ^~ /uploads/ {
    proxy_pass http://biopass-backend:4000/uploads/;
    proxy_set_header Host $host;
  }

  # Static assets & PWA Manifest
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|gif|ico|webmanifest|json)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
