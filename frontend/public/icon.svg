<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="55%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="panelShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#031b17" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed gradient tile (keeps the brand mark's ring visible after OS masking) -->
  <rect width="512" height="512" fill="url(#tile)" />

  <!-- Inset dark panel, matching the navbar mark's inner square. Kept within the
       ~80% maskable safe zone (409px circle centered at 256,256). -->
  <rect x="116" y="116" width="280" height="280" rx="62" fill="#081325" filter="url(#panelShadow)" />

  <!-- lucide "heart-pulse" glyph, scaled up and centered in the panel -->
  <g transform="translate(256 256) scale(6.6) translate(-12 -12)">
    <path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"
          fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"
          fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
