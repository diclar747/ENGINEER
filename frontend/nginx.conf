server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — el HTML del shell NO se cachea (network-first por el SW; y así
  # un rebrand/deploy llega en la próxima carga).
  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  # El service worker nunca debe quedar cacheado viejo.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # API + archivos subidos → backend.
  location ^~ /api/ {
    proxy_pass http://biopass-backend:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;
  }

  location ^~ /uploads/ {
    proxy_pass http://biopass-backend:4000/uploads/;
    proxy_set_header Host $host;
  }

  # Assets del build (nombre con hash de contenido) → cache inmutable larguísimo.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Manifest + íconos: nombre FIJO, cambian en un rebrand → hay que revalidar,
  # nunca "immutable" (por eso el ícono viejo seguía apareciendo al instalar).
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
  location = /manifest.json {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
  location ~* ^/(favicon\.svg|icon\.svg|icon-maskable\.svg|icon-192\.png|icon-512\.png|icon-maskable\.png|apple-touch-icon\.png)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
  }

  # Fuentes e imágenes de contenido → cache medio.
  location ~* \.(?:woff2?|ttf|otf|eot|jpg|jpeg|gif|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
